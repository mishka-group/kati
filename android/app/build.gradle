plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// ── Mob path config ───────────────────────────────────────────────────────────
// Reads from android/local.properties, falls back to environment variables.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localProps.load(localPropsFile.newDataInputStream())

def mobOtpRelease     = localProps.getProperty('mob.otp_release',      System.getenv('MOB_ANDROID_OTP_RELEASE')      ?: '')
def mobOtpReleaseArm32 = localProps.getProperty('mob.otp_release_arm32', System.getenv('MOB_ANDROID_OTP_RELEASE_ARM32') ?: mobOtpRelease)
def mobDir             = localProps.getProperty('mob.mob_dir',           System.getenv('MOB_DIR')                       ?: '')

// Auto-detect ERTS version from the OTP release directory (arm64 is canonical).
def ertsVsn = new File(mobOtpRelease).listFiles()
    ?.find { it.name.startsWith('erts-') }?.name ?: 'erts-17.0'

android {
    namespace 'com.example.kati'
    // KATI-BEGIN(K-02 api36) mob_new=0.4.20
    // was: compileSdk 34 / targetSdk 34
    compileSdk 36

    // Pin NDK to match the one that built the bundled OTP runtime.
    // libbeam.a embeds C++ stdlib symbols using a specific libc++ ABI
    // namespace. NDK 27 / clang 18 produces ne180000; NDK 25 / clang 14
    // produces ne140000. Mismatch fails to link with undefined
    // __cxa_* symbols. Bumping this requires rebuilding the OTP tarballs.
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "com.example.kati"
        minSdk 28
        targetSdk 36
        // KATI-END(K-02 api36)
        versionCode 1
        versionName "1.0"

        // KATI-BEGIN(K-01 abi-filters) mob_new=0.4.20
        // was: ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        // arm64-v8a ships to real devices; x86_64 exists so the app runs at
        // native speed on the emulator on an Intel host (this machine is an
        // i7-7700K, so the arm64 AVD would be software-emulated and unusable).
        // armeabi-v7a is dropped: it doubles the OTP runtime payload for
        // 32-bit devices that are gone from the install base, and Play has
        // required 64-bit since 2019. Release builds can strip x86_64 via a
        // splits/abi filter when that matters.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        // KATI-END(K-01 abi-filters)

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DOTP_RELEASE=${mobOtpRelease}",
                          "-DOTP_RELEASE_ARM32=${mobOtpReleaseArm32}",
                          "-DERTS_VSN=${ertsVsn}",
                          "-DMOB_DIR=${mobDir}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildTypes {
        release { minifyEnabled false }
        debug   { jniDebuggable true }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // AppCompat (required by MobScannerActivity which extends AppCompatActivity)
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Biometric authentication
    implementation 'androidx.biometric:biometric:1.1.0'

    // CameraX (QR scanner via MobScannerActivity)
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // ML Kit barcode scanning (QR scanner)
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // KATI-BEGIN(K-30 pruned-deps) mob_new=0.4.20
    // Removed by #75, with the Kotlin that referenced them:
    //
    //   com.google.firebase:firebase-bom + firebase-messaging, and the
    //     com.google.gms.google-services plugin and google-services.json.
    //     Kati is device-first with no server (#52); the shipped json was the
    //     mob_new placeholder and `notify_register_push` had no caller — see
    //     K-30 drop-push in MobBridge.kt.
    //
    //   com.google.android.gms:play-services-location. Location was extracted
    //     to the mob_location plugin in 0.7.20 and core keeps no shim, so the
    //     bridge's location methods were unreachable — see K-30 drop-location.
    //
    //   androidx.media3:media3-exoplayer + media3-ui. Nothing in the design
    //     plays video; the bridge's video node is a placeholder that names
    //     media3 in a comment and never imported it.
    //
    // androidx.camera, com.google.mlkit:barcode-scanning and
    // androidx.appcompat are still here: they carry the QR scanner and the
    // camera preview node, which is a larger removal (a node type, a
    // composable, a frame stream and two Activity launchers) and wants its
    // own change.
    // KATI-END(K-30 pruned-deps)

    // KATI-BEGIN(K-22 work-manager) mob_new=0.4.20
    // WHY: the periodic refresh in KatiRefreshWorker.kt. WorkManager rather
    // than AlarmManager for the *refresh* (air-date reminders stay on
    // AlarmManager, which is exact and is what a user is actually waiting
    // for): a repeating AlarmManager wakeup has no network or battery
    // constraint, does not survive an OEM battery saver, and lands in Android
    // Vitals' excessive-background-wakeups metric. WorkManager also
    // reschedules its own work after a reboot through the RescheduleReceiver
    // in its own AAR manifest, so Kati's AndroidManifest.xml needs nothing —
    // which is why #58's "undocumented manifest_application_snippets splice"
    // is not on Kati's critical path at all. See native/LEDGER.md.
    //
    // 2.9.1 pinned exactly, and it is the version #58's own research settled
    // on: it is the last line built against Kotlin 1.8 metadata, and this
    // project is on the Kotlin 1.9.22 Gradle plugin. The -ktx artifact is
    // needed for PeriodicWorkRequestBuilder<T>, which is an inline reified
    // function and has no Java equivalent.
    //
    // COST, stated rather than discovered: work-runtime pulls androidx.room
    // in transitively (WorkManager keeps its queue in a Room database).
    // Nothing else in Kati uses Room. That is the price of not writing a
    // scheduler.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    // KATI-END(K-22 work-manager)
}
