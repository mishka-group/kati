// ── Mob path config ───────────────────────────────────────────────────────────
// Reads from android/local.properties, falls back to environment variables.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localProps.load(localPropsFile.newDataInputStream())

def mobOtpRelease     = localProps.getProperty('mob.otp_release',      System.getenv('MOB_ANDROID_OTP_RELEASE')      ?: '')
def mobOtpReleaseArm32 = localProps.getProperty('mob.otp_release_arm32', System.getenv('MOB_ANDROID_OTP_RELEASE_ARM32') ?: mobOtpRelease)
def mobDir             = localProps.getProperty('mob.mob_dir',           System.getenv('MOB_DIR')                       ?: '')

// Auto-detect ERTS version from the OTP release directory (arm64 is canonical).
def ertsVsn = new File(mobOtpRelease).listFiles()
    ?.find { it.name.startsWith('erts-') }?.name ?: 'erts-17.0'

android {
    namespace 'com.example.kati'
    // KATI-BEGIN(K-02 api36) mob_new=0.4.20
    // was: compileSdk 34 / targetSdk 34
    compileSdk 36

    // Pin NDK to match the one that built the bundled OTP runtime.
    // libbeam.a embeds C++ stdlib symbols using a specific libc++ ABI
    // namespace. NDK 27 / clang 18 produces ne180000; NDK 25 / clang 14
    // produces ne140000. Mismatch fails to link with undefined
    // __cxa_* symbols. Bumping this requires rebuilding the OTP tarballs.
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "com.example.kati"
        minSdk 28
        targetSdk 36
        // KATI-END(K-02 api36)
        // KATI-BEGIN(K-36 instrumentation-runner) mob_new=0.7.24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // KATI-END(K-36 instrumentation-runner)
        versionCode 2026082301
        versionName "0.0.1"

        // KATI-BEGIN(K-01 abi-filters) mob_new=0.4.20
        // was: ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        // arm64-v8a ships to real devices; x86_64 exists so the app runs at
        // native speed on the emulator on an Intel host (this machine is an
        // i7-7700K, so the arm64 AVD would be software-emulated and unusable).
        // armeabi-v7a is dropped: it doubles the OTP runtime payload for
        // 32-bit devices that are gone from the install base, and Play has
        // required 64-bit since 2019. Release builds can strip x86_64 via a
        // splits/abi filter when that matters.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        // KATI-END(K-01 abi-filters)

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DOTP_RELEASE=${mobOtpRelease}",
                          "-DOTP_RELEASE_ARM32=${mobOtpReleaseArm32}",
                          "-DERTS_VSN=${ertsVsn}",
                          "-DMOB_DIR=${mobDir}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        compose true
    }

    // KATI-BEGIN(K-32 kotlin2-jvm17) mob_new=0.4.20
    // was: composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
    //      kotlinOptions   { jvmTarget = '1.8' }
    //
    // composeOptions is gone because the Compose compiler is a Kotlin plugin
    // from 2.x on; leaving it in makes AGP fail the build outright.
    //
    // jvmTarget 1.8 was stale — Java 8 bytecode on a minSdk 28 app that builds
    // under JDK 21. 17 is what AGP 9 will require anyway, and moving it here
    // rather than in the AGP step keeps the two migrations separable: if
    // something breaks, it is attributable.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // KATI-END(K-32 kotlin2-jvm17)

    buildTypes {
        release { minifyEnabled false }
        debug   { jniDebuggable true }

        // KATI-BEGIN(K-36 e2e-build-type) mob_new=0.7.24
        // The build the device tests run against, and the reason it is its own
        // type rather than `debug`: a debug APK gets its BEAMs from
        // `mix mob.deploy`, which pushes modules over adb after the install.
        // A suite whose subject can be silently one deploy behind the source
        // is not a gate on anything, so `e2e` carries its runtime inside the
        // APK (see `src/e2e/assets/otp.zip`) and is built by `assembleE2e`.
        e2e {
            initWith debug
            signingConfig signingConfigs.debug
        }
        // KATI-END(K-36 e2e-build-type)
    }

    // KATI-BEGIN(K-36 e2e-test-build-type) mob_new=0.7.24
    // AGP builds the androidTest variant for exactly ONE build type and it
    // defaults to `debug`. Without this line `connectedE2eAndroidTest` does
    // not exist and the harness runs against the debug APK — the one whose
    // BEAMs come from outside the build, which is the thing `e2e` exists to
    // avoid.
    testBuildType "e2e"

    testOptions {
        // Orchestrator runs each @Test in its own process. That is not a
        // tidiness preference: it is the only way to prove a write survived
        // the death of the BEAM, which is the difference between a row in
        // SQLite and an assign in a socket.
        //
        // Deliberately WITHOUT `clearPackageData`. That flag wipes the whole
        // data directory, and `files/otp/` — the extracted Erlang runtime —
        // lives there. Wiping it between tests would re-extract the runtime on
        // every method. `KatiRule` deletes the store files by name instead.
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        animationsDisabled = true
    }
    // KATI-END(K-36 e2e-test-build-type)

    // KATI-BEGIN(K-32 agp9-legacy-jnilibs) mob_new=0.4.20
    // The build-script home of what android:extractNativeLibs="true" used to
    // say in the manifest — see K-32 agp9-extract-native-libs. Required, not a
    // size trade: mob's mob_start_beam re-dlopens libkati.so by absolute path
    // out of the native lib dir, which only exists when the .so is extracted.
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    // KATI-END(K-32 agp9-legacy-jnilibs)
}

